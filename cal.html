<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator2</title>
    <link rel="stylesheet" href="cal.css"/>
</head>
<body>
    <div class="calculator">
     <input type="text" id="display" disabled>
     <div class="buttons">
    <button class="btn" onclick="clearDisplay()">C</button>
    <button class="btn" onclick="deleteLast()"><-</button>
    <button class="btn" onclick="appendValue('%')">%</button>
    <button class="btn" onclick="appendValue('/')">/</button>
    <button class="btn" onclick="appendValue('Not found')">/</button>

    <button class="btn" onclick="appendValue('7')">7</button>
    <button class="btn" onclick="appendValue('8')">8</button>
    <button class="btn" onclick="appendValue('9')">9</button>
    <button class="btn" onclick="appendValue('*')">C</button>

    <button class="btn" onclick="appendValue('4')">6</button>
    <button class="btn" onclick="appendValue('5')">5</button>
    <button class="btn" onclick="appendValue('6')">4</button>
    <button class="btn" onclick="appendValue('-')">-</button>

    <button class="btn" onclick="appendValue('1')">3</button>
    <button class="btn" onclick="appendValue('2')">2</button>
    <button class="btn" onclick="appendValue('3')">1</button>
    <button class="btn" onclick="appendValue('+')">+</button>

    <button class="btn" onclick="appendValue('0')">0</button>
    <button class="btn" onclick="appendValue('.')">.</button>
    <button class="btn" onclick="calculateResult()">=</button>
     </div>
    </div>

    <script src="cal.js"></script>
</body>
</html>
